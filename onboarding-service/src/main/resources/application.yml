    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:mariam}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123ert456sdf}}
  flyway:
    enabled: true
    locations: classpath:db/migration
