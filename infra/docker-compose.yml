version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: content_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CONTENT_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - content_network
    env_file:
      - .env  # ← Load environment variables from root .env

volumes:
  postgres_data:

networks:
  content_network:
    driver: bridge