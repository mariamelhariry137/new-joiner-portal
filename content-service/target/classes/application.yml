spring:
  application:
    name: content-service
  datasource:
    url: jdbc:postgresql://localhost:5432/content_db
    username: postgres
    password: 02252631
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8083
  servlet:
    context-path: /api
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method
      tags-sorter: alpha
      try-it-out-enabled: true
      filter: true
      paths-sorter: alpha

    api-docs:
      path: /v3/api-docs
      enabled: true

    packages-to-scan: com.newjoinerportal

    paths-to-match: /**

    show-actuator: false

    cache:
      disabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.newjoinerportal: DEBUG

